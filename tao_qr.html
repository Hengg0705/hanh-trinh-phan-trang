<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR phát hành Hành Trình Phấn Trắng</title>
<style>body{font-family:system-ui;max-width:700px;margin:30px auto;padding:20px;background:#eef5f8}main{background:white;padding:25px;border-radius:18px;box-shadow:0 8px 30px #0002}input,button{width:100%;padding:13px;margin:7px 0;font-size:17px;border-radius:9px;border:1px solid #aac}button{background:#17628d;color:white;border:0}img{display:block;width:min(500px,90%);margin:25px auto}</style>
<main><h1>🎓 QR phát hành</h1><p>Dán <b>URL công khai duy nhất</b> của game sau khi host.</p><input id=u placeholder="https://tenban.github.io/hanh-trinh-phan-trang/"><button onclick="go()">Tạo QR</button><img id=q><p id=o></p></main>
<script>function go(){let u=document.getElementById('u').value.trim();if(!/^https?:\\/\\//.test(u))return alert('URL phải bắt đầu bằng http:// hoặc https://');document.getElementById('q').src='https://api.qrserver.com/v1/create-qr-code/?size=700x700&data='+encodeURIComponent(u);document.getElementById('o').textContent='QR này trỏ trực tiếp tới game: '+u}</script>
